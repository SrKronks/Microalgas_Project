project:
  name: Microalgas_Project
  description: Advanced time-series analytics and forecasting for microalgae cultures.

data:
  raw_file: data/raw/data.xlsx
  sheet_name:
  date_column:
  group_column:
  target_columns:
    - OD
  classification_targets:
    - Ritmo
    - Estado_Cultivo
  preferred_analysis_columns:
    - OD
    - pH
    - EC
    - Temperatura
    - Temp
    - mu
    - growth
  drop_normalized_duplicates: false

execution:
  random_state: 42
  n_jobs: -1
  forecast_horizon: 5
  test_fraction: 0.25
  min_train_points: 5
  max_bims:
  continue_on_error: true
  save_models: true
  make_png: true
  make_svg: true
  make_pdf: true
  heavy_deep_learning: false

validation:
  strategy: synthetic_full_cycle
  imputation_strategy: time_interpolate
  outlier_method: iqr
  outlier_iqr_multiplier: 1.5
  rolling_windows:
    - 3
    - 5
  seasonal_periods: 3

synthetic_training:
  enabled: true
  n_cycles: 2000
  min_cycle_points: 48
  max_cycle_points: 96
  sampling_interval_days: 0.25
  ratios_to_evaluate:
    - 0
    - 1
    - 2
    - 5
    - 10
  noise_fraction: 0.035
  noise_fraction_grid:
    - 0.01
    - 0.03
    - 0.05
    - 0.10
  decline_probability: 0.70
  seasonality_probability: 0.45
  save_dataset: true
  quality:
    enabled: true
    max_ks_value: 0.35
    max_out_of_real_range_pct: 15.0

models:
  enabled_groups:
    classical: true
    statistical: true
    biological: true
    differential_equations: true
    probabilistic: true
    machine_learning: true
    deep_learning: true
    hybrid: true
  optional_models:
    xgboost: true
    lightgbm: true
    catboost: true
    prophet: true
    darts: true
    pymc: true

classification:
  enabled: true
  test_fraction: 0.25
  validation_strategy: stratified_holdout
  min_samples: 20
  min_class_count: 2
  max_missing_feature_pct: 0.60
  confidence_threshold: 0.65
  use_probabilities_as_regression_context: true
  save_models: true

sensitivity:
  enabled: true
  default_grid:
    synthetic_training.noise_fraction:
      - 0.01
      - 0.03
      - 0.05
      - 0.10
    synthetic_training.decline_probability:
      - 0.40
      - 0.70
      - 0.90
    machine_learning.Random_Forest.n_estimators:
      - 100
      - 300
      - 600
    machine_learning.Random_Forest.lags:
      - 2
      - 3
      - 5
    machine_learning.Elastic_Net.alpha:
      - 0.0001
      - 0.001
      - 0.01
    machine_learning.Elastic_Net.l1_ratio:
      - 0.2
      - 0.5
      - 0.8

model_hyperparameters:
  classical:
    Moving_Average:
      window: 3
    Weighted_Moving_Average:
      window: 3
    Croston:
      alpha: 0.1
  statistical:
    VAR:
      maxlags: 2
    VARMAX:
      varmax_order: [1, 0]
      maxiter: 100
    ARCH:
      p: 1
      q: 0
    GARCH:
      p: 1
      q: 1
    State_Space_Model:
      level: local linear trend
  biological:
    Curve_Fit:
      maxfev: 20000
  differential_equations:
    Curve_Fit:
      maxfev: 20000
  probabilistic:
    Hidden_Markov_Models:
      n_components: 3
      n_iter: 200
    Markov_Chains:
      n_states: 3
    Gaussian_Processes:
      normalize_y: true
    Particle_Filters:
      particles: 500
    Monte_Carlo:
      simulations: 500
    Sequential_Monte_Carlo:
      particles: 500
  machine_learning:
    phase_aware:
      phase_aware: true
      min_phase_samples: 80
    Linear_Regression:
      lags: 3
    Polynomial_Regression:
      lags: 3
      degree: 2
    Ridge:
      lags: 3
      alpha: 1.0
    Lasso:
      lags: 3
      alpha: 0.001
      max_iter: 10000
    Elastic_Net:
      lags: 3
      alpha: 0.001
      l1_ratio: 0.5
      max_iter: 10000
    Decision_Trees:
      lags: 3
      max_depth: 4
    Random_Forest:
      lags: 3
      n_estimators: 200
    Extra_Trees:
      lags: 3
      n_estimators: 200
    Gradient_Boosting:
      lags: 3
    AdaBoost:
      lags: 3
    SVR:
      lags: 3
      C: 10.0
      epsilon: 0.01
    KNN:
      lags: 3
      n_neighbors: 3
    Gaussian_Process_Regression:
      lags: 3
      normalize_y: true
    PLS:
      lags: 3
      n_components: 1
    PCR:
      lags: 3
      n_components: 1
    XGBoost:
      lags: 3
      n_estimators: 200
      objective: reg:squarederror
    LightGBM:
      lags: 3
      n_estimators: 200
      verbose: -1
    CatBoost:
      lags: 3
      iterations: 200
      verbose: false
  deep_learning:
    MLP:
      lags: 4
      hidden_layer_sizes: [32, 16]
      max_iter: 1000
    RNN:
      lags: 4
      epochs: 40
      units: 16
    LSTM:
      lags: 4
      epochs: 40
      units: 16
    Bidirectional_LSTM:
      lags: 4
      epochs: 40
      units: 16
    GRU:
      lags: 4
      epochs: 40
      units: 16
    CNN_temporal:
      lags: 4
      epochs: 40
      units: 16

reporting:
  language: es
  title: Plataforma de analisis y pronostico de microalgas
  author: Sebastian Pizarro
  export_excel: true
  export_html: true
  export_pdf: true
